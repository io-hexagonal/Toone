<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Five checks in the Toone AI-native operating-model diagnostic</title>
  <desc id="desc">A cycle connects core work dependency, encoded organization, persistent operating context, governed action, and measured feedback. The diagnostic is qualitative and produces no score.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5c7c72"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#141413" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="#f0ede6"/>
  <text x="72" y="82" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#1d1c19">Is the process AI-native?</text>
  <text x="72" y="120" font-family="Arial,sans-serif" font-size="20" fill="#625f57">Five qualitative evidence checks from Toone Diagnostic v1.0.0</text>
  <g stroke="#5c7c72" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M268 232h75"/><path d="M523 232h75"/><path d="M778 232h75"/>
    <path d="M943 308c0 72-88 107-175 107"/><path d="M598 415H285c-80 0-130-50-115-107"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial,sans-serif">
    <g><rect x="88" y="168" width="180" height="140" rx="18" fill="#fff"/><circle cx="122" cy="203" r="19" fill="#e0ebe6"/><text x="122" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#44685d">1</text><text x="112" y="248" font-size="20" font-weight="700" fill="#1d1c19">Core work</text><text x="112" y="275" font-size="20" font-weight="700" fill="#1d1c19">dependency</text></g>
    <g><rect x="343" y="168" width="180" height="140" rx="18" fill="#fff"/><circle cx="377" cy="203" r="19" fill="#e0ebe6"/><text x="377" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#44685d">2</text><text x="367" y="248" font-size="20" font-weight="700" fill="#1d1c19">Encoded</text><text x="367" y="275" font-size="20" font-weight="700" fill="#1d1c19">organization</text></g>
    <g><rect x="598" y="168" width="180" height="140" rx="18" fill="#fff"/><circle cx="632" cy="203" r="19" fill="#e0ebe6"/><text x="632" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#44685d">3</text><text x="622" y="248" font-size="20" font-weight="700" fill="#1d1c19">Persistent</text><text x="622" y="275" font-size="20" font-weight="700" fill="#1d1c19">context</text></g>
    <g><rect x="853" y="168" width="180" height="140" rx="18" fill="#fff"/><circle cx="887" cy="203" r="19" fill="#e7e1ea"/><text x="887" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#62556b">4</text><text x="877" y="248" font-size="20" font-weight="700" fill="#1d1c19">Governed</text><text x="877" y="275" font-size="20" font-weight="700" fill="#1d1c19">action</text></g>
    <g><rect x="598" y="365" width="180" height="110" rx="18" fill="#fff"/><circle cx="632" cy="400" r="19" fill="#e0ebe6"/><text x="632" y="407" text-anchor="middle" font-size="18" font-weight="700" fill="#44685d">5</text><text x="622" y="445" font-size="20" font-weight="700" fill="#1d1c19">Measured feedback</text></g>
  </g>
  <rect x="72" y="526" width="1056" height="56" rx="14" fill="#dedbd3"/>
  <text x="600" y="561" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#3f3c36">Inspect the evidence. Record gaps and owners. Do not calculate a score.</text>
</svg>
